name: Send Code Diff to Discord

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Качаем историю, чтобы гарантированно найти точку сравнения

      - name: Get changed lines (diff) and save to file
        id: git_diff
        run: |
          # Определяем базовый коммит для сравнения (обрабатываем первый коммит в ветке)
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # Если это самый первый коммит в репозитории, сравниваем с пустым деревом
            DIFF_TEXT=$(git diff-tree -r -p --no-commit-id HEAD | grep -E "^[+-][^+--]" | head -n 500)
          else
            # В обычных случаях сравниваем предыдущее состояние push-события с текущим HEAD
            DIFF_TEXT=$(git diff ${{ github.event.before }} HEAD | grep -E "^[+-][^+--]" | head -n 500)
          fi
          
          if [ -z "$DIFF_TEXT" ]; then
            DIFF_TEXT="Нет текстовых изменений в коде"
          fi
          
          echo "$DIFF_TEXT" > changes.diff

      - name: Send to Discord
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: "Akane Coder"
          content: |
            **Новый коммит от ${{ github.actor }}!**
            📝 *Комментарий:* ${{ github.event.head_commit.message }}
          filename: changes.diff

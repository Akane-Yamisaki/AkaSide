name: Send Code Diff to Discord

on:
  push:
    branches:
      - main  # Ваша ветка

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed lines (diff)
        id: git_diff
        run: |
          # Собираем измененные строки
          DIFF_TEXT=$(git diff HEAD~1 HEAD | grep -E "^[+-][^+--]" | head -n 20)
          
          # Если изменений нет (например, первый коммит), пишем заглушку
          if [ -z "$DIFF_TEXT" ]; then
            DIFF_TEXT="Нет текстовых изменений в коде (возможно, добавлен бинарный файл или ассет)"
          fi
          
          # Безопасное сохранение многострочного текста в GitHub Actions
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send to Discord
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: "Akane Coder"
          content: |
            **Новый коммит от ${{ github.actor }}!**
            📝 *Комментарий:* ${{ github.event.head_commit.message }}
            
            ```diff
            ${{ steps.git_diff.outputs.diff }}
            ```
